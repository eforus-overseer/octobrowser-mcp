<svg width="880" height="240" viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OctoBrowser-MCP — steer antidetect browser profiles with AI over the Model Context Protocol">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF3FE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5EEFF"/>
      <stop offset="1" stop-color="#D6E4FF"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="arms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4255"/>
      <stop offset="1" stop-color="#20242F"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="4" y="4" width="872" height="232" rx="22" fill="url(#card)" stroke="#DCE6FB" stroke-width="1.5"/>

  <!-- Octopus tile -->
  <rect x="34" y="44" width="152" height="152" rx="26" fill="url(#tile)"/>
  <g transform="translate(38,48) scale(0.72)">
    <g fill="none" stroke="url(#arms)" stroke-width="12" stroke-linecap="round">
      <path d="M 62,112 C 40,140 34,150 22,150"/>
      <path d="M 68,116 C 52,150 44,168 34,178"/>
      <path d="M 79,120 C 71,155 67,178 61,192"/>
      <path d="M 92,122 C 90,158 92,180 86,196"/>
      <path d="M 108,122 C 110,158 108,180 114,196"/>
      <path d="M 121,120 C 129,155 133,178 139,192"/>
      <path d="M 132,116 C 148,150 156,168 166,178"/>
      <path d="M 138,112 C 160,140 166,150 178,150"/>
    </g>
    <path d="M 55,118 C 55,60 75,32 100,32 C 125,32 145,60 145,118 Z" fill="url(#bell)"/>
    <ellipse cx="84" cy="92" rx="13" ry="15" fill="#FFFFFF"/>
    <ellipse cx="116" cy="92" rx="13" ry="15" fill="#FFFFFF"/>
    <circle cx="88" cy="95" r="6" fill="#14329B"/>
    <circle cx="112" cy="95" r="6" fill="#14329B"/>
    <circle cx="90" cy="92" r="2" fill="#FFFFFF"/>
    <circle cx="114" cy="92" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="214" y="96" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#2563EB">ANTIDETECT&#160;BROWSER&#160;&#183;&#160;MCP&#160;SERVER</text>
  <text x="212" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#20242F">OctoBrowser<tspan fill="#2563EB">-MCP</tspan></text>
  <text x="214" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" fill="#4F5D75">Steer browser profiles with AI over the Model Context Protocol</text>

  <!-- MCP protocol mark -->
  <g transform="translate(788,120)">
    <polygon points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32" fill="url(#hex)"/>
    <polygon points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.55"/>
    <!-- protocol graph: three linked nodes -->
    <g stroke="#60A5FA" stroke-width="2.2" fill="#60A5FA">
      <line x1="-20" y1="-16" x2="20" y2="-16"/>
      <line x1="-20" y1="-16" x2="0" y2="16"/>
      <line x1="20" y1="-16" x2="0" y2="16"/>
      <circle cx="-20" cy="-16" r="5.5"/>
      <circle cx="20" cy="-16" r="5.5"/>
      <circle cx="0" cy="16" r="5.5"/>
    </g>
    <text x="0" y="44" text-anchor="middle" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2" fill="#FFFFFF">MCP</text>
  </g>
</svg>
