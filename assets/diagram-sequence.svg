<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequence: You ask for a profile by name, the server finds it, starts it, connects over CDP, navigates and screenshots.">
  <defs>
    <marker id="seq-mut" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#51607A"/></marker>
    <marker id="seq-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#096DD9"/></marker>
  </defs>

  <!-- Card -->
  <rect x="4" y="4" width="792" height="612" rx="16" fill="#F7FAFF" stroke="#D6E4FF" stroke-width="1.5"/>

  <!-- Title -->
  <text x="28" y="40" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#002766">A typical flow: launch by name and screenshot</text>

  <!-- Lifelines -->
  <line x1="100" y1="80" x2="100" y2="580" stroke="#9FB5DE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="80" x2="280" y2="580" stroke="#9FB5DE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="80" x2="480" y2="580" stroke="#9FB5DE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="680" y1="80" x2="680" y2="580" stroke="#9FB5DE" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Actor/System headers -->
  <rect x="44" y="58" width="112" height="28" rx="6" fill="#F0F8FF" stroke="#1890FF" stroke-width="1.5"/>
  <text x="100" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif" font-size="11" font-weight="600" fill="#002766">You</text>

  <rect x="224" y="58" width="112" height="28" rx="6" fill="#F0F8FF" stroke="#1890FF" stroke-width="1.5"/>
  <text x="280" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif" font-size="11" font-weight="600" fill="#002766">octobrowser-mcp</text>

  <rect x="424" y="58" width="112" height="28" rx="6" fill="#F0F8FF" stroke="#1890FF" stroke-width="1.5"/>
  <text x="480" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif" font-size="11" font-weight="600" fill="#002766">Octo APIs</text>

  <rect x="624" y="58" width="112" height="28" rx="6" fill="#F0F8FF" stroke="#28CCCC" stroke-width="1.5"/>
  <text x="680" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif" font-size="11" font-weight="600" fill="#002766">Browser</text>

  <!-- Message 1: You → MCP (request) -->
  <path d="M100,120 H280" fill="none" stroke="#1890FF" stroke-width="2" marker-end="url(#seq-link)"/>
  <rect x="140" y="104" width="120" height="18" fill="#F7FAFF"/><text x="144" y="116" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#002766">start profile "work_US"</text>

  <!-- Message 2: MCP → Octo (find) -->
  <path d="M280,160 H480" fill="none" stroke="#096DD9" stroke-width="2" marker-end="url(#seq-link)"/>
  <rect x="350" y="144" width="60" height="18" fill="#F7FAFF"/><text x="354" y="156" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#096DD9">find by name</text>

  <!-- Message 3: Octo → MCP (return profile) -->
  <path d="M480,200 H280" fill="none" stroke="#51607A" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#seq-mut)"/>
  <rect x="360" y="184" width="60" height="18" fill="#F7FAFF"/><text x="364" y="196" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#51607A">uuid, proxy, …</text>

  <!-- Message 4: MCP → Octo (launch) -->
  <path d="M280,240 H480" fill="none" stroke="#096DD9" stroke-width="2" marker-end="url(#seq-link)"/>
  <rect x="350" y="224" width="60" height="18" fill="#F7FAFF"/><text x="354" y="236" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#096DD9">launch (uuid)</text>

  <!-- Message 5: Octo → Browser (side-effect: launch profile) -->
  <path d="M480,280 H680" fill="none" stroke="#51607A" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#seq-mut)"/>
  <text x="560" y="272" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#51607A">launch</text>

  <!-- Message 6: Octo → MCP (return ws_endpoint) -->
  <path d="M480,320 H280" fill="none" stroke="#51607A" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#seq-mut)"/>
  <rect x="340" y="304" width="80" height="18" fill="#F7FAFF"/><text x="344" y="316" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#51607A">ws://localhost:…</text>

  <!-- Message 7: MCP → You (return ws_endpoint) -->
  <path d="M280,360 H100" fill="none" stroke="#51607A" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#seq-mut)"/>
  <rect x="160" y="344" width="80" height="18" fill="#F7FAFF"/><text x="164" y="356" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#51607A">ws_endpoint</text>

  <!-- Message 8: You → MCP (connect) -->
  <path d="M100,400 H280" fill="none" stroke="#1890FF" stroke-width="2" marker-end="url(#seq-link)"/>
  <rect x="158" y="384" width="64" height="18" fill="#F7FAFF"/><text x="162" y="396" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#002766">browser_connect</text>

  <!-- Message 9: MCP → Browser (CDP connect) -->
  <path d="M280,440 H680" fill="none" stroke="#096DD9" stroke-width="2" marker-end="url(#seq-link)"/>
  <text x="460" y="432" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#096DD9">CDP over ws://</text>

  <!-- Message 10: You → MCP (navigate + screenshot) -->
  <path d="M100,480 H280" fill="none" stroke="#1890FF" stroke-width="2" marker-end="url(#seq-link)"/>
  <rect x="138" y="464" width="84" height="18" fill="#F7FAFF"/><text x="142" y="476" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#002766">browser_navigate +</text>
  <text x="142" y="494" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#002766">browser_screenshot</text>

  <!-- Message 11: MCP → Browser (drive) -->
  <path d="M280,520 H680" fill="none" stroke="#1890FF" stroke-width="2" marker-end="url(#seq-link)"/>
  <text x="460" y="512" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#096DD9">navigate + screenshot</text>

  <!-- Result -->
  <text x="28" y="606" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="12" fill="#51607A">Result: one sentence → profile launched, browser driven, screenshot captured.</text>
</svg>
